# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

# Configuração padrão para SQLite (usada para cache, queue, cable)
sqlite_default: &sqlite_default
  adapter: sqlite3
  <<: *default

# Configuração padrão para PostgreSQL (usada para primary)
pg_default: &pg_default
  adapter: postgresql
  encoding: unicode
  <<: *default

development:
  primary:
    <<: *pg_default
    database: <%= ENV['POSTGRES_DB'] || 'tiktok_clone_python_development' %>
    username: <%= ENV['POSTGRES_USER'] || 'postgres' %>
    password: <%= ENV['POSTGRES_PASSWORD'] || 'postgres' %>
    host: <%= ENV['POSTGRES_HOST'] || 'localhost' %>
    port: <%= ENV['POSTGRES_PORT'] || 5432 %>

  cache:
    <<: *sqlite_default
    database: storage/development_cache.sqlite3
    migrations_paths: db/cache_migrate

  queue:
    <<: *sqlite_default
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate

  cable:
    <<: *sqlite_default
    database: storage/development_cable.sqlite3
    migrations_paths: db/cable_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *pg_default
    database: <%= ENV['POSTGRES_DB_TEST'] || 'tiktok_clone_python_test' %>
    username: <%= ENV['POSTGRES_USER'] || 'postgres' %>
    password: <%= ENV['POSTGRES_PASSWORD'] || 'postgres' %>
    host: <%= ENV['POSTGRES_HOST'] || 'localhost' %>
    port: <%= ENV['POSTGRES_PORT'] || 5432 %>

  cache:
    <<: *sqlite_default
    database: storage/test_cache.sqlite3
    migrations_paths: db/cache_migrate

  queue:
    <<: *sqlite_default
    database: storage/test_queue.sqlite3
    migrations_paths: db/queue_migrate

  cable:
    <<: *sqlite_default
    database: storage/test_cable.sqlite3
    migrations_paths: db/cable_migrate

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *pg_default
    database: <%= ENV['POSTGRES_DB'] || 'tiktok_clone_python_production' %>
    username: <%= ENV['POSTGRES_USER'] %>
    password: <%= ENV['POSTGRES_PASSWORD'] %>
    host: <%= ENV['POSTGRES_HOST'] %>
    port: <%= ENV['POSTGRES_PORT'] || 5432 %>

  cache:
    <<: *sqlite_default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate

  queue:
    <<: *sqlite_default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate

  cable:
    <<: *sqlite_default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
